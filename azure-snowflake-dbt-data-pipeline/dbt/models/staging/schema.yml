version: 2

sources:
  - name: raw
    description: Raw source data loaded into Snowflake.
    tables:
      - name: orders
        description: Source order transactions.

models:
  - name: stg_orders
    description: Cleaned and standardized order records.

    columns:
      - name: order_id
        description: Source-system order identifier.
        tests:
          - not_null
          - unique

      - name: customer_id
        description: Source-system customer identifier.
        tests:
          - not_null

      - name: store_id
        description: Source-system store identifier.

      - name: order_date
        description: Date on which the order was placed.

      - name: order_status
        description: Standardized order status.
